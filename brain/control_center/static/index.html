<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>City Brain control center</title>
<meta name="description" content="One control center for the City Brain: waste, air quality, energy and transport, with their agents.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23142130'/%3E%3Ccircle cx='10' cy='11' r='3' fill='%232fa8a0'/%3E%3Ccircle cx='22' cy='10' r='3' fill='%23d55181'/%3E%3Ccircle cx='11' cy='22' r='3' fill='%239085e9'/%3E%3Ccircle cx='22' cy='22' r='3' fill='%233987e5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
<script>
  try { const t = localStorage.getItem("cb-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="Domains">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
        <rect width="34" height="34" rx="9" fill="var(--panel)" stroke="var(--line)"/>
        <path d="M11 12 L23 11 M11 12 L12 23 M23 11 L23 23 M12 23 L23 23 M11 12 L23 23" stroke="var(--line)" stroke-width="1.4"/>
        <circle cx="11" cy="12" r="3.2" fill="var(--waste)"/>
        <circle cx="23" cy="11" r="3.2" fill="var(--air)"/>
        <circle cx="12" cy="23" r="3.2" fill="var(--energy)"/>
        <circle cx="23" cy="23" r="3.2" fill="var(--transport)"/>
      </svg>
      <div>
        <div class="brand-name">City Brain</div>
        <div class="brand-sub">TSYP14 control center</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">
      <div class="links" id="links" aria-label="Backend links"></div>
      <div class="rail-tools">
        <span class="clock num" id="clock"></span>
        <button class="btn icon-btn ghost" id="theme" type="button" aria-label="Switch light or dark theme" title="Switch theme">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13Zm0 1.5v10a5 5 0 0 1 0-10Z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <h1 id="title">Overview</h1>
      <div class="spacer"></div>
      <span class="runinfo" id="runinfo" aria-live="polite"></span>
      <button class="btn stopall" type="button" id="stopall" disabled title="No scenario is running">&#9632; Stop scenario</button>
      <span class="srcbadge off" id="srcbadge" title="Which data the City Brain is using">Brain offline</span>
      <span class="live" id="live"><i></i><span>Connecting</span></span>
    </header>
    <div class="cb-top" id="cb-top" aria-label="Three most important situations of each axis"></div>
    <main class="content" id="content" tabindex="-1"></main>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
