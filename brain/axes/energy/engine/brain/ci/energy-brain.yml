# GitHub Actions: copy to <repo root>/.github/workflows/energy-brain.yml
# Runs every test and the whole energy Test Book on each push / pull request,
# and keeps the scenario logs as a downloadable artifact.
name: energy-brain
on:
  push:
    paths: ["brain/**", ".github/workflows/energy-brain.yml"]
  pull_request:
    paths: ["brain/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brain
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit, chaos, MCP and simulator tests
        run: python -m pytest -q
      - name: Energy Test Book (all scenarios, simulated clock)
        run: python -m scenarios.run all
      - name: Test Book over MCP
        run: python -m scenarios.run all --twin mcp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenario-logs
          path: logs/
