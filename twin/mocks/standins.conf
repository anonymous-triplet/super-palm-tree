# ============================================================================================================
#  standins.conf - the two stand-in layers that let the twin run on its own (R1).
#
#  Each stand-in is a separate process with its own key pair, its own MCP endpoint (mutual TLS 1.3) and its own idea of
#  where its partners are, as a real partner team's layer would have. Paths are relative to this file. The twin's side of
#  these links is in ../twin.conf; the launcher checks that the two agree.
# ============================================================================================================

[brain]
identity = city-brain
listen_host = 127.0.0.1
listen_port = 8741
endpoint = /mcp
hostnames = localhost, 127.0.0.1
certificate = ../keys/city-brain.cert.pem
private_key = ../keys/city-brain.key.pem
trusted_ca = ../keys/triplet-ca.cert.pem
tls_min_version = 1.3
# Who may call the Brain's tools (certificate identities).
accept = city-twin
# The twin and the Guardian, as the Brain reaches them.
twin_url = https://127.0.0.1:8740/mcp
twin_identity = city-twin
guardian_url = https://127.0.0.1:8742/mcp
guardian_identity = guardian
timeout_s = 8

[guardian]
identity = guardian
listen_host = 127.0.0.1
listen_port = 8742
endpoint = /mcp
hostnames = localhost, 127.0.0.1
certificate = ../keys/guardian.cert.pem
private_key = ../keys/guardian.key.pem
trusted_ca = ../keys/triplet-ca.cert.pem
tls_min_version = 1.3
accept = city-brain, city-twin
twin_url = https://127.0.0.1:8740/mcp
twin_identity = city-twin
timeout_s = 8
