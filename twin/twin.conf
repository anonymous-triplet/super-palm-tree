# ============================================================================================================
#  twin.conf - how the Digital Twin connects to its partner layers (City Brain, Guardian).
#
#  Everything about the MCP links lives here: this layer's endpoint and identity, its key pair and the authorities it
#  trusts, every partner's address and identity, what each partner may call, and where the run logs go. Nothing about a
#  partner is written anywhere else in the code. Paths are relative to this file.
#
#  Transport: MCP (JSON-RPC 2.0, Streamable HTTP) inside TLS 1.3 with a certificate on both sides (mutual TLS).
#  - Encryption in transit: TLS 1.3.
#  - Authentication: each side proves who it is with its private key; the certificate's common name ("identity") must
#    match the partner configured below, and it must be signed by an authority listed in trusted_ca.
#  To connect another team's layer, see twin/INTERFACE.md ("Connecting a partner").
# ============================================================================================================

[twin]
# This layer's identity: the common name in its certificate. Partners check it when they connect to the twin.
identity = city-twin
# Where partners reach the twin's MCP endpoint. Use 0.0.0.0 (and add the machine's address to hostnames) when the
# partners run on other machines.
listen_host = 127.0.0.1
listen_port = 8740
endpoint = /mcp
# Names and addresses the twin's certificate is valid for (partners connect to one of these).
hostnames = localhost, 127.0.0.1
# The twin's key pair (PEM) and every certificate authority whose certificates it accepts (comma separated).
certificate = keys/city-twin.cert.pem
private_key = keys/city-twin.key.pem
trusted_ca = keys/triplet-ca.cert.pem
tls_min_version = 1.3
# yes: the launcher creates (or renews) the key pairs in keys/ from the local triplet authority (keys/triplet-ca.*).
# no:  the files above are provided by you (for example signed by a partner team's authority) and are only checked.
manage_keys = yes

[logs]
# One file per incident run (named by time, scenario and incident) and one per session.
directory = ../logs
# Payloads longer than this are cut in the log file (the rest is never needed to follow a run).
payload_limit_kb = 64

[decisions]
# Who decides which unit answers each emergency call: brain (the City Brain, through the twin's dispatch_units tool)
# or twin (the twin's own dispatcher, without asking). When the Brain is unreachable the twin dispatches by itself.
dispatch = brain
# The twin renews the Brain's authority over dispatch every 2 s for this many seconds; if the gateway stops, it lapses.
lease_s = 6

[partner:brain]
role = brain
# Where the twin calls the City Brain, and the identity its certificate must carry.
url = https://127.0.0.1:8741/mcp
identity = city-brain
# The Brain's tools the twin calls.
report_tool = report_incident
close_tool = close_incident
timeout_s = 8
# What the Brain may call on the twin: read_only (every read-only tool) plus the tools named here.
allow = read_only, dispatch_units, post_briefing
# yes: the launcher starts the bundled stand-in (twin/mocks) at this address. no: a real City Brain runs there.
standin = yes

[partner:guardian]
role = guardian
url = https://127.0.0.1:8742/mcp
identity = guardian
# The twin calls no Guardian tool: the Guardian reads the twin's data itself; the twin keeps the link alive (MCP ping).
timeout_s = 8
allow = read_only, post_briefing
standin = yes

[client:operator]
# The twin's own operator client (the scenario runner): it may call everything and is logged as OPERATOR.
identity = twin-operator
certificate = keys/twin-operator.cert.pem
private_key = keys/twin-operator.key.pem
allow = all
