<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>City Ground Zero — Control Dashboard</title>
<link rel="icon" href="/logo.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><img src="/logo.png" alt=""><div><b>City Ground Zero</b><span>Live operations · MCP</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <div><span class="dot" id="linkdot"></span><span id="linktext">connecting…</span></div>
      <div id="rate">–</div>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <div class="clock"><b id="clock">--:--:--</b><span id="clocksub">waiting for the city…</span></div>
      <div class="pills" id="pills"></div>
      <div class="quick" id="quick"></div>
    </header>
    <main class="views" id="views"></main>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="/charts.js"></script>
<script src="/jsonview.js"></script>
<script src="/app.js"></script>
<script src="/views.js"></script>
<script src="/views2.js"></script>
</body>
</html>
